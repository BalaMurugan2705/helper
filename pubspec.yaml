name: helper
description: domiq
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  lottie: ^3.1.2
  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/app_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_logo.png"
    background_color: "#0F0F1A"
    theme_color: "#7C4DFF"

flutter:
  uses-material-design: true
  assets:
    - assets/
